<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Splat Island</title>
<style>
  :root{--fg:#f6f1ea;--glass:rgba(10,8,18,.5)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#05040a;overflow:hidden;font:14px/1.3 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  .title{position:fixed;left:18px;top:14px;pointer-events:none;text-shadow:0 1px 16px rgba(0,0,0,.7)}
  .title h1{margin:0;font-size:22px;letter-spacing:.06em;font-weight:700}
  .title p{margin:2px 0 0;font-size:13px;opacity:.82;max-width:min(420px,80vw)}
  .bar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:12px;align-items:center;padding:9px 14px;border-radius:999px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.13);max-width:calc(100vw - 16px)}
  .tod{display:flex;align-items:center;gap:8px}
  .tod span{font-size:12px;opacity:.8;white-space:nowrap}
  input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:6px;border-radius:99px;background:linear-gradient(90deg,#10153a,#ff8a5c 30%,#8fd3ff 55%,#ff6f91 78%,#10153a);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.25);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.25);cursor:pointer}
  button{font:inherit;color:var(--fg);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:7px 12px;cursor:pointer;flex:none}
  button:hover{background:rgba(255,255,255,.2)}
  button.on{background:rgba(255,255,255,.3)}
  .credit{position:fixed;right:12px;top:16px;font-size:11px;opacity:.5;pointer-events:none;text-align:right;max-width:44vw}
  .fps{position:fixed;left:18px;bottom:calc(20px + env(safe-area-inset-bottom));font-size:11px;opacity:.55;pointer-events:none}
  .fail{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:16px}
  @media (max-width:560px){.credit,.fps{display:none}.tod span{display:none}input[type=range]{width:96px}.bar{gap:6px;padding:7px 9px;font-size:13px}button{padding:6px 9px}.title h1{font-size:19px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title"><h1>SPLAT ISLAND</h1><p>A dream island built from 40,960 soft Gaussian blobs, rendered live. Drag to orbit, pinch or scroll to zoom.</p></div>
<div class="credit">Surfaces flattened by local PCA, after PCAsplat (arXiv 2610.11011)</div>
<div class="fps" id="fps"></div>
<div class="bar">
  <div class="tod"><span>Night</span><input id="tod" type="range" min="0" max="1000" value="720" aria-label="Time of day"><span>Day</span></div>
  <button id="tour" class="on">Tour</button>
  <button id="again">Replay</button>
  <button id="snap">Snap</button>
</div>
<div class="fail" id="fail">This demo needs WebGL2 with float textures.</div>
<script>
(()=>{
"use strict";
const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});
if(!gl){document.getElementById('fail').style.display='flex';return;}

// ---------- tiny math ----------
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=mulberry(20261010);
const R=(a,b)=>a+(b-a)*rnd();
function gauss(){let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2831853*v);}
function h2(x,y){let n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);}
function vn(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;const u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  return h2(ix,iy)*(1-u)*(1-v)+h2(ix+1,iy)*u*(1-v)+h2(ix,iy+1)*(1-u)*v+h2(ix+1,iy+1)*u*v;}
function fbm(x,y){let s=0,a=.5;for(let i=0;i<4;i++){s+=a*vn(x,y);x=x*2.03+3.1;y=y*2.03+1.7;a*=.5;}return s;}
const mix=(a,b,t)=>a+(b-a)*t, clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
function hsl(h,s,l){const f=n=>{const k=(n+h*12)%12,a=s*Math.min(l,1-l);return l-a*Math.max(-1,Math.min(k-3,9-k,1));};return[f(0),f(8),f(4)];}

// ---------- scene generation ----------
const W=2048, N=40960, FIREFLIES=512, SURF=N-FIREFLIES;
const P=new Float32Array(N*3);          // final centres
const S=new Float32Array(N*3);          // final scales
const Q=new Float32Array(N*4);          // final quats
const C=new Float32Array(N*4);          // rgb + emissive
const OP=new Float32Array(N);           // opacity
const KIND=new Uint8Array(N);           // 0 surface (PCA-flattened), 1 blob, 2 firefly
let n=0;
function add(x,y,z,col,op,sx,sy,sz,kind,em){
  P[n*3]=x;P[n*3+1]=y;P[n*3+2]=z;S[n*3]=sx;S[n*3+1]=sy;S[n*3+2]=sz;C[n*4]=col[0];C[n*4+1]=col[1];C[n*4+2]=col[2];C[n*4+3]=em||0;OP[n]=op;KIND[n]=kind;
  const a=rnd()*6.28318,b=Math.acos(2*rnd()-1),c2=rnd()*6.28318; // random orientation for blobs
  const sa=Math.sin(b/2);Q[n*4]=sa*Math.cos(a);Q[n*4+1]=sa*Math.sin(a);Q[n*4+2]=Math.cos(b/2)*Math.sin(c2)*.0+sa*Math.cos(c2)*.3;Q[n*4+3]=Math.cos(b/2);
  const l=Math.hypot(Q[n*4],Q[n*4+1],Q[n*4+2],Q[n*4+3]);for(let k=0;k<4;k++)Q[n*4+k]/=l;n++;}
const grass=[[.16,.62,.42],[.25,.72,.35],[.12,.52,.46],[.42,.78,.38]];
function topY(x,z){const r=Math.hypot(x,z);const edge=smooth(r,5.2,5.9);return .55*fbm(x*.45+7,z*.45+2)-.18+.12*Math.sin(x*.8)*Math.cos(z*.7)-edge*.55;}
function smooth(x,a,b){const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);}
const POND={x:1.9,z:1.3,r:1.35};
// island top
for(let i=0;i<12400;i++){
  const rr=5.9*Math.sqrt(rnd())*(0.97+.05*rnd()),th=rnd()*6.28318;let x=rr*Math.cos(th),z=rr*Math.sin(th);
  const rad=5.6+.55*Math.sin(th*3+1)+.3*Math.sin(th*7);if(rr>rad)continue;
  let y=topY(x,z),col=grass[(rnd()*4)|0].slice(),pd=Math.hypot(x-POND.x,z-POND.z);
  if(pd<POND.r){const d=1-pd/POND.r;y-=.22*Math.sqrt(d)+.05;col=[.1+.1*d,.42+.2*(1-d),.7+.15*rnd()];}
  else if(pd<POND.r+.35){col=[.74,.68,.5];}
  const e=smooth(rr,rad-.7,rad);col=[mix(col[0],.5,e*.8),mix(col[1],.38,e*.8),mix(col[2],.3,e*.8)];
  const k=.85+.3*rnd();col=[col[0]*k,col[1]*k,col[2]*k];
  if(n<12400)add(x,y,z,col,.92,.085,.085,.085,0,0);
}
while(n<12400){add(0,topY(0,0),0,grass[0],.9,.08,.08,.08,0,0);}
// flowers (emissive dots)
for(let i=0;i<420;i++){let x,z,t=0;do{const rr=4.9*Math.sqrt(rnd()),th=rnd()*6.28318;x=rr*Math.cos(th);z=rr*Math.sin(th);t++;}while(Math.hypot(x-POND.x,z-POND.z)<POND.r+.4&&t<20);
  const hue=[.93,.12,.55,.7][(rnd()*4)|0];add(x,topY(x,z)+.05,z,hsl(hue,.9,.65),.95,.04,.04,.04,1,.8);}
// underside rock
for(let i=0;i<8600;i++){
  const th=rnd()*6.28318,u=Math.pow(rnd(),.7);const rad=5.6+.55*Math.sin(th*3+1)+.3*Math.sin(th*7);
  const rr=rad*(1-u*.97),yy=-u*u*0+(-(rad-rr)*.78*(1+.35*fbm(th*2,u*3)))-.3-.35*fbm(rr,th*3);
  const wob=1+.06*(fbm(th*5+rr,u*7)-.5);const x=rr*Math.cos(th)*wob,z=rr*Math.sin(th)*wob;
  const t=fbm(x*.5,yy*.8+z*.5);const k=.5+.55*t;const band=.5+.5*Math.sin(yy*3.2+fbm(x,z)*3);
  add(x,yy,z,[.34*k+.12*band,.28*k+.07*band,.26*k+.08*band],.95,.11,.11,.11,0,0);
}
// tree: trunk and branches
const TX=-1.5,TZ=-.6,TB=topY(TX,TZ);
function trunkPt(t){return[TX+.35*Math.sin(t*3.2)+.2*t,TB+t*2.7,TZ+.25*Math.cos(t*2.6)];}
for(let i=0;i<3100;i++){const t=rnd(),c=trunkPt(t),r=mix(.26,.08,t)*(1+.2*Math.sin(t*20)*.3);const a=rnd()*6.28318;
  const k=.8+.4*rnd();add(c[0]+r*Math.cos(a),c[1],c[2]+r*Math.sin(a),[.34*k,.22*k,.15*k],.95,.06,.06,.06,0,0);}
const tops=[];
for(let b=0;b<5;b++){const a=b*1.25+.4,start=.45+.1*b/5,c0=trunkPt(start),len=1.1+.5*rnd();const end=[c0[0]+Math.cos(a)*len,c0[1]+.6+.35*rnd(),c0[2]+Math.sin(a)*len];tops.push(end);
  for(let i=0;i<640;i++){const t=rnd(),x=mix(c0[0],end[0],t),y=mix(c0[1],end[1],t)+.35*Math.sin(t*3.14),z=mix(c0[2],end[2],t),r=mix(.1,.03,t);const aa=rnd()*6.28318;
    const k=.8+.4*rnd();add(x+r*Math.cos(aa),y+r*Math.sin(aa),z,[.34*k,.22*k,.15*k],.95,.045,.045,.045,0,0);}}
const topT=trunkPt(1);tops.push([topT[0],topT[1]+.3,topT[2]]);
// islets
const ISL=[[-6.8,2.6,2.5,.9],[6.6,3.3,-3.2,.7],[-3.4,4.4,-6.4,.55]];
for(const [ix,iy,iz,s] of ISL){
  for(let i=0;i<1350;i++){const a=rnd()*6.28318,b=Math.acos(2*rnd()-1);const rx=s*1.4,ry=s*.8;let x=Math.sin(b)*Math.cos(a),y=Math.cos(b),z=Math.sin(b)*Math.sin(a);
    const rr=1+.18*(fbm(x*2.2+ix,z*2.2+iy)-.5);const top=y>.15?1:0;const k=.55+.5*fbm(x*3,z*3+y*3);
    const col=top?[.2*k+.12,.62*k,.38*k+.08]:[.38*k,.3*k,.28*k];if(y<-.2)y*=1.9;
    add(ix+x*rx*rr,iy+y*ry*rr,iz+z*rx*rr,col,.95,.075,.075,.075,0,0);}
  for(let i=0;i<300;i++){const a=rnd()*6.28318,r=rnd()*.5*s,h=rnd()*s*1.1*(1-r/(s*.55));add(ix+Math.cos(a)*r,iy+s*.65+h,iz+Math.sin(a)*r,[.35+.2*rnd(),.9,1],.9,.03,.03,.03,1,1);}
}
// canopy: luminous blossom blobs
const canopyCount=SURF-n-800;
for(let i=0;i<canopyCount;i++){const c=tops[(rnd()*tops.length)|0];const sg=.55+.2*rnd();
  const x=c[0]+gauss()*sg,y=c[1]+.2+Math.abs(gauss())*sg*.7,z=c[2]+gauss()*sg;const k=rnd();
  const col=k<.5?hsl(.94+.03*rnd(),.75,.7+.1*rnd()):(k<.8?hsl(.88,.7,.78):hsl(.02,.8,.82));
  const sc=.065+.06*rnd();add(x,y,z,col,.55+.3*rnd(),sc,sc,sc,1,.55);}
// mist
for(let i=0;i<800;i++){const th=rnd()*6.28318,r=3+rnd()*5;add(Math.cos(th)*r,-1.8-rnd()*3.2,Math.sin(th)*r,[.55,.62,.85],.07+.05*rnd(),.7,.35,.7,1,0);}
while(n<SURF)add(0,-4,0,[.3,.3,.4],.01,.1,.1,.1,1,0);
// fireflies
const FF=[];for(let i=0;i<FIREFLIES;i++){FF.push({r:1+rnd()*6.5,a:rnd()*6.28,s:(.15+rnd()*.35)*(rnd()<.5?-1:1),y:-.5+rnd()*4.5,p:rnd()*9,ph:rnd()*6.28});add(0,0,0,[1,.9,.5],.8,.035,.035,.035,2,1);}

// ---------- PCA flattening (the PCAsplat idea): normals from local covariance ----------
function pcaFlatten(){
  const CELL=.3,map=new Map(),key=(x,y,z)=>x*73856093^y*19349663^z*83492791;
  const idxs=[];for(let i=0;i<SURF;i++)if(KIND[i]===0)idxs.push(i);
  const cx=i=>Math.floor(P[i*3]/CELL),cy=i=>Math.floor(P[i*3+1]/CELL),cz=i=>Math.floor(P[i*3+2]/CELL);
  for(const i of idxs){const k=key(cx(i),cy(i),cz(i));let a=map.get(k);if(!a){a=[];map.set(k,a);}a.push(i);}
  const nb=[];
  for(const i of idxs){
    const x0=cx(i),y0=cy(i),z0=cz(i);nb.length=0;
    for(let dx=-1;dx<=1&&nb.length<26;dx++)for(let dy=-1;dy<=1&&nb.length<26;dy++)for(let dz=-1;dz<=1&&nb.length<26;dz++){
      const a=map.get(key(x0+dx,y0+dy,z0+dz));if(!a)continue;for(let q=0;q<a.length&&nb.length<26;q++){const j=a[q];const ddx=P[j*3]-P[i*3],ddy=P[j*3+1]-P[i*3+1],ddz=P[j*3+2]-P[i*3+2];if(ddx*ddx+ddy*ddy+ddz*ddz<.12)nb.push(j);}}
    let mx=0,my=0,mz=0;for(const j of nb){mx+=P[j*3];my+=P[j*3+1];mz+=P[j*3+2];}const m=Math.max(1,nb.length);mx/=m;my/=m;mz/=m;
    let a=0,b=0,c=0,d=0,e=0,f=0;for(const j of nb){const x=P[j*3]-mx,y=P[j*3+1]-my,z=P[j*3+2]-mz;a+=x*x;b+=x*y;c+=x*z;d+=y*y;e+=y*z;f+=z*z;}
    const ev=eig3(a,b,c,d,e,f);   // returns [t1,t2,n] axes, n = smallest variance direction
    let[t1,t2,nr]=ev; // make a right-handed basis
    const cr=[t1[1]*t2[2]-t1[2]*t2[1],t1[2]*t2[0]-t1[0]*t2[2],t1[0]*t2[1]-t1[1]*t2[0]];if(cr[0]*nr[0]+cr[1]*nr[1]+cr[2]*nr[2]<0)nr=[-nr[0],-nr[1],-nr[2]];
    setQuatFromBasis(i,t1,t2,nr);
    const sc=S[i*3];S[i*3]=sc;S[i*3+1]=sc*(.9+.2*rnd());S[i*3+2]=sc*.17;
  }
}
function eig3(a,b,c,d,e,f){ // Jacobi on symmetric 3x3; returns eigenvectors sorted by descending eigenvalue
  const A=[[a,b,c],[b,d,e],[c,e,f]],V=[[1,0,0],[0,1,0],[0,0,1]];
  for(let it=0;it<12;it++){let p=0,q=1,mx=Math.abs(A[0][1]);if(Math.abs(A[0][2])>mx){p=0;q=2;mx=Math.abs(A[0][2]);}if(Math.abs(A[1][2])>mx){p=1;q=2;mx=Math.abs(A[1][2]);}
    if(mx<1e-12)break;const th=.5*Math.atan2(2*A[p][q],A[q][q]-A[p][p]),cs=Math.cos(th),sn=Math.sin(th);
    for(let k=0;k<3;k++){const akp=A[k][p],akq=A[k][q];A[k][p]=cs*akp-sn*akq;A[k][q]=sn*akp+cs*akq;}
    for(let k=0;k<3;k++){const apk=A[p][k],aqk=A[q][k];A[p][k]=cs*apk-sn*aqk;A[q][k]=sn*apk+cs*aqk;}
    for(let k=0;k<3;k++){const vkp=V[k][p],vkq=V[k][q];V[k][p]=cs*vkp-sn*vkq;V[k][q]=sn*vkp+cs*vkq;}}
  const ord=[0,1,2].sort((i,j)=>A[j][j]-A[i][i]);return ord.map(k=>[V[0][k],V[1][k],V[2][k]]);}
function setQuatFromBasis(i,x,y,z){const m00=x[0],m10=x[1],m20=x[2],m01=y[0],m11=y[1],m21=y[2],m02=z[0],m12=z[1],m22=z[2];
  const tr=m00+m11+m22;let qx,qy,qz,qw;
  if(tr>0){const s=Math.sqrt(tr+1)*2;qw=.25*s;qx=(m21-m12)/s;qy=(m02-m20)/s;qz=(m10-m01)/s;}
  else if(m00>m11&&m00>m22){const s=Math.sqrt(1+m00-m11-m22)*2;qw=(m21-m12)/s;qx=.25*s;qy=(m01+m10)/s;qz=(m02+m20)/s;}
  else if(m11>m22){const s=Math.sqrt(1+m11-m00-m22)*2;qw=(m02-m20)/s;qx=(m01+m10)/s;qy=.25*s;qz=(m12+m21)/s;}
  else{const s=Math.sqrt(1+m22-m00-m11)*2;qw=(m10-m01)/s;qx=(m02+m20)/s;qy=(m12+m21)/s;qz=.25*s;}
  const l=Math.hypot(qx,qy,qz,qw)||1;Q[i*4]=qx/l;Q[i*4+1]=qy/l;Q[i*4+2]=qz/l;Q[i*4+3]=qw/l;}
pcaFlatten();

// ---------- GL setup ----------
const VS=`#version 300 es
precision highp float;precision highp int;precision highp sampler2D;
uniform sampler2D uData;uniform mat4 uView,uProj;uniform vec2 uVP;uniform vec3 uSun,uSunCol,uAmb;uniform float uGlow;
in vec2 aCorner;in int aIdx;
out vec4 vC;out vec2 vP;
ivec2 tc(int i,int k){int t=i*4+k;return ivec2(t&2047,t>>11);}
void main(){
  int i=aIdx;
  vec4 t0=texelFetch(uData,tc(i,0),0),t1=texelFetch(uData,tc(i,1),0),q=texelFetch(uData,tc(i,2),0),col=texelFetch(uData,tc(i,3),0);
  vec4 cam=uView*vec4(t0.xyz,1.);vec4 p2=uProj*cam;
  float cl=1.25*p2.w;
  if(p2.z<-p2.w||p2.x<-cl||p2.x>cl||p2.y<-cl||p2.y>cl){gl_Position=vec4(0.,0.,2.,1.);vC=vec4(0);vP=vec2(0);return;}
  float x=q.x,y=q.y,z=q.z,w=q.w;
  mat3 Rm=mat3(1.-2.*(y*y+z*z),2.*(x*y+w*z),2.*(x*z-w*y), 2.*(x*y-w*z),1.-2.*(x*x+z*z),2.*(y*z+w*x), 2.*(x*z+w*y),2.*(y*z-w*x),1.-2.*(x*x+y*y));
  mat3 M=mat3(Rm[0]*t1.x,Rm[1]*t1.y,Rm[2]*t1.z);
  mat3 Sg=M*transpose(M);
  mat3 Wm=mat3(uView);
  float d=-cam.z;float fx=uProj[0][0]*uVP.x*.5,fy=uProj[1][1]*uVP.y*.5;
  mat3 J=mat3(fx/d,0.,0., 0.,fy/d,0., fx*cam.x/(d*d),fy*cam.y/(d*d),0.);
  mat3 T=J*Wm;mat3 cv=T*Sg*transpose(T);
  float a=cv[0][0]+.3,b=cv[0][1],c=cv[1][1]+.3;
  float mid=.5*(a+c),rad=length(vec2(.5*(a-c),b));float l1=mid+rad,l2=max(mid-rad,.1);
  vec2 dg=abs(b)<1e-7?(a>=c?vec2(1.,0.):vec2(0.,1.)):normalize(vec2(b,l1-a));
  vec2 mj=min(sqrt(2.*l1),700.)*dg,mn=min(sqrt(2.*l2),700.)*vec2(dg.y,-dg.x);
  // lighting: world normal = third axis of rotation
  vec3 nrm=Rm[2];float lam=abs(dot(nrm,uSun));
  vec3 lit=uAmb+uSunCol*(.35+.65*lam);
  vec3 base=col.rgb;float em=col.a;
  vec3 rgb=mix(base*lit,base*(1.+uGlow)*1.15,em);
  vC=vec4(rgb,t0.w);vP=aCorner;
  vec2 ctr=p2.xy/p2.w;
  gl_Position=vec4(ctr+(aCorner.x*mj+aCorner.y*mn)*2./uVP,p2.z/p2.w,1.);
}`;
const FS=`#version 300 es
precision highp float;in vec4 vC;in vec2 vP;out vec4 o;
void main(){float A=-dot(vP,vP);if(A<-4.)discard;float B=exp(A)*vC.a;if(B<.004)discard;o=vec4(vC.rgb,B);}`;
const SKY_VS=`#version 300 es
in vec2 a;out vec2 v;void main(){v=a;gl_Position=vec4(a,.9999,1);}`;
const SKY_FS=`#version 300 es
precision highp float;in vec2 v;out vec4 o;uniform vec3 uR,uU,uF;uniform vec2 uT;uniform vec3 uZen,uHor,uSun;uniform float uNight,uTime;
float h(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
void main(){vec3 d=normalize(uF+uR*v.x*uT.x+uU*v.y*uT.y);
  float g=clamp(d.y*1.4+.25,0.,1.);vec3 c=mix(uHor,uZen,pow(g,.8));
  float sd=max(dot(d,uSun),0.);c+=uHor*1.4*pow(sd,6.)*(1.-uNight*.8)+vec3(1.,.85,.6)*pow(sd,180.)*(1.-uNight);
  vec3 sp=floor(d*160.);float st=step(.9965,h(sp))*(.5+.5*sin(uTime*2.+h(sp+3.)*30.));c+=vec3(st)*uNight*smoothstep(-.05,.3,d.y);
  c+=vec3(.06,.09,.2)*uNight*smoothstep(.3,.9,fbmish(d));
  o=vec4(c,1);}
float fbmish(vec3 d){return 0.;}
`.replace("float fbmish(vec3 d){return 0.;}","").replace("void main(){vec3 d=","float fbmish(vec3 d){return .5+.5*sin(d.x*3.+d.y*5.)*sin(d.z*4.);}\nvoid main(){vec3 d=");
function mk(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;}
function pr(v,f){const p=gl.createProgram();gl.attachShader(p,mk(gl.VERTEX_SHADER,v));gl.attachShader(p,mk(gl.FRAGMENT_SHADER,f));if(v===VS){gl.bindAttribLocation(p,0,'aCorner');gl.bindAttribLocation(p,1,'aIdx');}else gl.bindAttribLocation(p,0,'a');gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));const u={};for(let i=0;i<gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);i++){const k=gl.getActiveUniform(p,i).name;u[k]=gl.getUniformLocation(p,k);}return{p,u};}
const sp=pr(VS,FS),sky=pr(SKY_VS,SKY_FS);
// splat vertex arrays
const vaoS=gl.createVertexArray();gl.bindVertexArray(vaoS);
const cb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,cb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-2,-2,2,-2,-2,2,2,2]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const ib=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,ib);const order=new Int32Array(N);for(let i=0;i<N;i++)order[i]=i;gl.bufferData(gl.ARRAY_BUFFER,order,gl.DYNAMIC_DRAW);
gl.enableVertexAttribArray(1);gl.vertexAttribIPointer(1,1,gl.INT,0,0);gl.vertexAttribDivisor(1,1);
const vaoK=gl.createVertexArray();gl.bindVertexArray(vaoK);const kb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,kb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
// data texture: 4 texels per splat
const ROWS=Math.ceil(N*4/W);const data=new Float32Array(W*ROWS*4);
const dtex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,dtex);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA32F,W,ROWS,0,gl.RGBA,gl.FLOAT,data);
const CUR=new Float32Array(N*3);   // live centres (for sorting)
function writeSplat(i,px,py,pz,sx,sy,sz,op){const o=i*16;data[o]=px;data[o+1]=py;data[o+2]=pz;data[o+3]=op;data[o+4]=sx;data[o+5]=sy;data[o+6]=sz;data[o+7]=0;
  data[o+8]=Q[i*4];data[o+9]=Q[i*4+1];data[o+10]=Q[i*4+2];data[o+11]=Q[i*4+3];data[o+12]=C[i*4];data[o+13]=C[i*4+1];data[o+14]=C[i*4+2];data[o+15]=C[i*4+3];CUR[i*3]=px;CUR[i*3+1]=py;CUR[i*3+2]=pz;}

// ---------- state ----------
let introT=0,introDone=false,tod=.72,tour=true,lastInput=-9,time=0;
const PORT=innerWidth<innerHeight;let yaw=.7,pitch=.32,dist=15,tYaw=.7,tPitch=.32,tDist=PORT?14:12.5;
const swirlSeed=new Float32Array(N*3);for(let i=0;i<N*3;i++)swirlSeed[i]=gauss();
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);
function writeIntro(e){
  const e2=ease(e);
  for(let i=0;i<SURF;i++){
    const k=KIND[i];const swirl=(1-e2);
    const a=swirl*swirl*3.2;
    const sx=swirlSeed[i*3]*3.2*swirl,sy=swirlSeed[i*3+1]*2.4*swirl,sz=swirlSeed[i*3+2]*3.2*swirl;
    const px=P[i*3]+sx*Math.cos(a)-sz*Math.sin(a),py=P[i*3+1]+sy,pz=P[i*3+2]+sx*Math.sin(a)+sz*Math.cos(a);
    const fat=.2*swirl;
    writeSplat(i,px,py,pz,S[i*3]+fat,S[i*3+1]+fat,S[i*3+2]+fat*(k===0?1:1),mix(.35,OP[i],e2));
  }
  for(let i=SURF;i<N;i++)writeFirefly(i-SURF);
  gl.bindTexture(gl.TEXTURE_2D,dtex);gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,W,ROWS,gl.RGBA,gl.FLOAT,data);
}
function writeFirefly(j){const f=FF[j],i=SURF+j,a=f.a+time*f.s,r=f.r*(1+.08*Math.sin(time*.7+f.p));
  const x=Math.cos(a)*r,z=Math.sin(a)*r,y=f.y+.5*Math.sin(time*.9+f.p)+(f.r<3?.4:0);
  const fl=.5+.5*Math.sin(time*3+f.ph);const night=nightAmt();
  writeSplat(i,x,y,z,.04,.04,.04,(.25+.75*fl)*(.35+.65*night));}
function writeFireflyRow(){const first=SURF*16,last=N*16;const row0=Math.floor(first/(W*4)),row1=Math.ceil(last/(W*4));
  for(let j=0;j<FIREFLIES;j++)writeFirefly(j);
  gl.bindTexture(gl.TEXTURE_2D,dtex);gl.texSubImage2D(gl.TEXTURE_2D,0,0,row0,W,row1-row0,gl.RGBA,gl.FLOAT,data.subarray(row0*W*4,row1*W*4));}
function replay(){introT=0;introDone=false;time=0;dist=18;tDist=12.5;}
document.getElementById('again').onclick=replay;

// ---------- time of day ----------
const KEYS=[ // t, zenith, horizon, sunColor, ambient
 [0.00,[.01,.015,.06],[.05,.07,.18],[.25,.3,.6],[.18,.2,.38]],
 [0.20,[.12,.1,.3],[.95,.5,.5],[.9,.55,.5],[.35,.28,.4]],
 [0.50,[.2,.45,.85],[.7,.85,1.],[1.,.97,.9],[.45,.5,.6]],
 [0.75,[.28,.2,.5],[1.,.52,.28],[1.,.7,.45],[.4,.3,.38]],
 [1.00,[.01,.015,.06],[.05,.07,.18],[.25,.3,.6],[.18,.2,.38]]];
function todSample(t){let a=KEYS[0],b=KEYS[1];for(let i=0;i<KEYS.length-1;i++)if(t>=KEYS[i][0]&&t<=KEYS[i+1][0]){a=KEYS[i];b=KEYS[i+1];break;}
  const k=(t-a[0])/(b[0]-a[0]);const m=(x,y)=>x.map((v,i)=>mix(v,y[i],k));return{zen:m(a[1],b[1]),hor:m(a[2],b[2]),sun:m(a[3],b[3]),amb:m(a[4],b[4])};}
function nightAmt(){return clamp(1-Math.sin(tod*Math.PI)*1.6+.15,0,1);}
const todEl=document.getElementById('tod');todEl.oninput=()=>{tod=todEl.value/1000;};

// ---------- camera ----------
function mat4Persp(f,asp,n,fa){const t=1/Math.tan(f/2);return new Float32Array([t/asp,0,0,0,0,t,0,0,0,0,(fa+n)/(n-fa),-1,0,0,2*fa*n/(n-fa),0]);}
function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function norm(a){const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l];}
function lookAt(e,t){const f=norm([t[0]-e[0],t[1]-e[1],t[2]-e[2]]),r=norm(cross(f,[0,1,0])),u=cross(r,f);
  return{m:new Float32Array([r[0],u[0],-f[0],0,r[1],u[1],-f[1],0,r[2],u[2],-f[2],0,-(r[0]*e[0]+r[1]*e[1]+r[2]*e[2]),-(u[0]*e[0]+u[1]*e[1]+u[2]*e[2]),(f[0]*e[0]+f[1]*e[1]+f[2]*e[2]),1]),r,u,f};}

// ---------- input ----------
const ptr=new Map();let pinch0=0;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});lastInput=time;if(ptr.size===2){const[a,b]=[...ptr.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);}});
canvas.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;lastInput=time;
  if(ptr.size===1){tYaw-=dx*.006;tPitch=clamp(tPitch+dy*.005,-.25,1.2);}
  else if(ptr.size===2){const[a,b]=[...ptr.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0>0)tDist=clamp(tDist*pinch0/d,5,24);pinch0=d;}});
const up=e=>{ptr.delete(e.pointerId);pinch0=0;};canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{e.preventDefault();tDist=clamp(tDist*Math.exp(e.deltaY*.001),5,24);lastInput=time;},{passive:false});
const tourBtn=document.getElementById('tour');tourBtn.onclick=()=>{tour=!tour;tourBtn.classList.toggle('on',tour);};
document.getElementById('snap').onclick=()=>{frame(performance.now(),true);const a=document.createElement('a');a.download='splat-island.png';a.href=canvas.toDataURL('image/png');a.click();};

// ---------- sizing ----------
let W_=0,H_=0;
function resize(){const dpr=Math.min(devicePixelRatio||1,1.6);W_=Math.max(2,Math.round(canvas.clientWidth*dpr));H_=Math.max(2,Math.round(canvas.clientHeight*dpr));canvas.width=W_;canvas.height=H_;}
addEventListener('resize',resize);resize();

// ---------- sorting ----------
const keys=new Uint16Array(N),outIdx=new Int32Array(N),cnt=new Uint32Array(65536);
function sortSplats(f,e){
  let mn=1e9,mx=-1e9;const fx=f[0],fy=f[1],fz=f[2];const ex=e[0],ey=e[1],ez=e[2];
  for(let i=0;i<N;i++){const d=(CUR[i*3]-ex)*fx+(CUR[i*3+1]-ey)*fy+(CUR[i*3+2]-ez)*fz;keys[i]=0;outIdx[i]=0;const dd=d;CUR2[i]=dd;if(dd<mn)mn=dd;if(dd>mx)mx=dd;}
  const sc=65535/Math.max(1e-6,mx-mn);cnt.fill(0);
  for(let i=0;i<N;i++){const k=65535-((CUR2[i]-mn)*sc|0);keys[i]=k;cnt[k]++;}   // far first
  let s=0;for(let k=0;k<65536;k++){const c=cnt[k];cnt[k]=s;s+=c;}
  for(let i=0;i<N;i++)outIdx[cnt[keys[i]]++]=i;
  gl.bindBuffer(gl.ARRAY_BUFFER,ib);gl.bufferSubData(gl.ARRAY_BUFFER,0,outIdx);
}
const CUR2=new Float32Array(N);

// ---------- frame ----------
let fcount=0,last=performance.now(),fpsT=0,fpsN=0;const fpsEl=document.getElementById('fps');
function frame(now,still){
  const raw=still?0:(now-last)/1000,dt=Math.min(.05,raw);last=now;time+=dt;
  if(!introDone){introT+=raw/2.8;if(introT>=1){introT=1;introDone=true;}writeIntro(introT);}
  else writeFireflyRow();
  // camera
  const idle=time-lastInput;
  if(tour&&idle>3&&introDone){tYaw+=dt*.07;tPitch=.28+.12*Math.sin(time*.13);tDist=(PORT?13.5:11)+2.5*Math.sin(time*.1);}
  const k=1-Math.pow(.0015,dt);yaw+=(tYaw-yaw)*k;pitch+=(tPitch-pitch)*k;dist+=(tDist-dist)*k*.8;
  const tgt=[0,.7,0];const cp=Math.cos(pitch),sp_=Math.sin(pitch);
  const eye=[tgt[0]+dist*cp*Math.sin(yaw),tgt[1]+dist*sp_,tgt[2]+dist*cp*Math.cos(yaw)];
  const L=lookAt(eye,tgt);const asp=W_/H_;const fov=asp<1?1.05:.85;const proj=mat4Persp(fov,asp,.1,80);
  const sm=todSample(tod),night=nightAmt();
  const sunA=tod*Math.PI*2-Math.PI/2*0;const sunDir=norm([Math.cos(sunA*.5+.4)*.7,Math.sin(tod*Math.PI)*.8+.1,.5]);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W_,H_);gl.disable(gl.DEPTH_TEST);gl.disable(gl.BLEND);
  // sky
  gl.useProgram(sky.p);gl.bindVertexArray(vaoK);
  gl.uniform3fv(sky.u.uR,L.r);gl.uniform3fv(sky.u.uU,L.u);gl.uniform3fv(sky.u.uF,L.f);gl.uniform2f(sky.u.uT,Math.tan(fov/2)*asp,Math.tan(fov/2));
  gl.uniform3fv(sky.u.uZen,sm.zen);gl.uniform3fv(sky.u.uHor,sm.hor);gl.uniform3fv(sky.u.uSun,sunDir);gl.uniform1f(sky.u.uNight,night);gl.uniform1f(sky.u.uTime,time);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  // splats
  if(still||(fcount++&1)===0)sortSplats(L.f,eye);
  gl.useProgram(sp.p);gl.bindVertexArray(vaoS);gl.enable(gl.BLEND);gl.blendFuncSeparate(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA,gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,dtex);gl.uniform1i(sp.u.uData,0);
  gl.uniformMatrix4fv(sp.u.uView,false,L.m);gl.uniformMatrix4fv(sp.u.uProj,false,proj);gl.uniform2f(sp.u.uVP,W_,H_);
  gl.uniform3fv(sp.u.uSun,sunDir);gl.uniform3fv(sp.u.uSunCol,sm.sun.map(v=>v*.9));gl.uniform3fv(sp.u.uAmb,sm.amb);gl.uniform1f(sp.u.uGlow,.1+night*1.1);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,N);
  if(!still){fpsN++;fpsT+=dt;if(fpsT>.5){fpsEl.textContent=Math.round(fpsN/fpsT)+' fps · '+N.toLocaleString()+' splats';fpsT=0;fpsN=0;}}
}
function loop(now){frame(now,false);requestAnimationFrame(loop);}
if(location.hash==='#still'){introT=1;introDone=true;writeIntro(1);}
requestAnimationFrame(loop);
window.__splat={N,get intro(){return introT}};
})();
</script>
</body>
